origin_resource = "location"

provider = "aws"
regions = { "json!" = "aws-regions.json"}

[[create_resource]]
resource_type = "region"
relation_type = "DERIVED_FROM"
name = "{{- regions[origin_resource.name].aws_region_id -}}"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
provider = "{{- provider -}}"
availability_zone = ["a","b"]
api = "https://service-code.region-code.amazonaws.com"
router = "{{- provider | lower -}}-{{- origin_resource.code | lower -}}-transit-router"
kms = "{{- provider | lower -}}-{{- origin_resource.code | lower -}}-vault"
description = "The region describes a physical, geographical location where data is stored, and applications run, managed by {{ provider }}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
