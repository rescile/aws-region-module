# Ressource
origin_resource = "subscription"

# Oracle Cloud Infrastructure Output
[[output]]
resource_type = "python"
name = "orchestrator_script"
filename = "main.py"
mimetype = "text/x-python"

template = '''
import argparse
import sys
# Import your modules
from module.vpc_builder import create_vpc, delete_vpc
from module.https_ingress_filter import create_security_group, delete_security_group

if __name__ == "__main__":
    parser = argparse.ArgumentParser(description="AWS Transit Hub Orchestrator")
    parser.add_argument("--delete", action="store_true", help="Teardown the infrastructure")
    args = parser.parse_args()

    # Configuration mapped from your Tera/Jinja template context
    VPC_NAME = "{{- origin_resource.network_name -}}".strip()
    CIDR = "{{- origin_resource.cidr -}}".strip()
    REGION = "{{- origin_resource.region | default(value='eu-central-2') -}}".strip()
    SG_NAME = "{{- origin_resource.sg_name -}}".strip()
    SG_DESC = "{{- origin_resource.sg_description -}}"

    if args.delete:
        print("--- STARTING TEARDOWN ---")
        # 1. Delete Security Group first (Dependencies must be destroyed first!)
        # (We need a quick lookup function or pass variables here)
        # delete_security_group(vpc_id, SG_NAME, REGION)

        # 2. Delete VPC last
        delete_vpc(VPC_NAME, REGION)

    else:
        print("--- STARTING DEPLOYMENT ---")
        # 1. Build the network
        vpc = create_vpc(CIDR, VPC_NAME, REGION)

        if not vpc:
            print("FATAL: VPC creation failed. Aborting orchestration.")
            sys.exit(1)

        # 2. Build the security rules inside that specific VPC
        sg = create_security_group(vpc.id, SG_NAME, SG_DESC, REGION)
        if sg:
            print(f"SUCCESS: Infrastructure is fully operational.")
'''
