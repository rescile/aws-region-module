# Ressource
origin_resource = "dns"

# Oracle Cloud Infrastructure Output
[[output]]
resource_type = "aws_dns_template"
name = "{{- origin_resource.name -}}_template"
filename = "{{- provider | lower -}}_{{- origin_resource.name | lower -}}.py"
mimetype = "text/x-python"

template = '''
{
import boto3
from botocore.exceptions import ClientError
import time

def create_phz(vpc_id, domain_name, region):
    route53 = boto3.client('route53')
    response = route53.create_hosted_zone(
        Name=domain_name,
        VPC={
            'VPCRegion': region,
            'VPCId': vpc_id
        },
        CallerReference=str(time.time()), # Unique string to prevent duplicate calls
        HostedZoneConfig={'Comment': 'Private Zone for VPC traffic', 'PrivateZone': True}
    )
    zone_id = response['HostedZone']['Id']
    print(f"Created Private Hosted Zone: {zone_id}")
    return zone_id
'''
