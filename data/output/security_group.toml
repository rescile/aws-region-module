# Ressource
origin_resource = "port_filter"

# Oracle Cloud Infrastructure Output
[[output]]
resource_type = "python"
name = "{{- origin_resource.name -}}_script"
filename = "{{- origin_resource.name | lower -}}.py"
mimetype = "text/x-python"

template = '''
import argparse

import boto3
from botocore.exceptions import ClientError


# Retrieving VPC details by name and region
def get_vpc_details(vpc_name_query, region):
    # WICHTIG: Der Client MUSS die Region wissen, in der die VPC liegt
    ec2_client = boto3.client("ec2", region_name=region)

    clean_name = vpc_name_query.strip()
    print(f"DEBUG: Suche in Region '{region}' nach VPC: '{clean_name}'")

    filters = [{"Name": "tag:Name", "Values": [f"*{clean_name}*"]}]
    vpcs = ec2_client.describe_vpcs(Filters=filters).get("Vpcs", [])

    if not vpcs:
        raise Exception(
            f"VPC '{clean_name}' wurde in der Region '{region}' nicht gefunden!"
        )

    return vpcs[0]["VpcId"], region


# Check whether the Security Group already exists for the VPC
def get_existing_sg(ec2_resource, vpc_id, group_name):
    """Checking whether the Security Group already exists for the VPC."""
    sgs = list(
        ec2_resource.security_groups.filter(
            Filters=[
                {"Name": "group-name", "Values": [group_name]},
                {"Name": "vpc-id", "Values": [vpc_id]},
            ]
        )
    )
    return sgs[0] if sgs else None


# Creating the Security Group
def create_security_group(vpc_id, group_name, description, region):
    ec2 = boto3.resource("ec2", region_name=region)

    # Checking whether resource already exists
    existing_sg = get_existing_sg(ec2, vpc_id, group_name)
    if existing_sg:
        print(
            f"INFO: Security Group '{group_name}' existiert bereits ({existing_sg.id})."
        )
        return existing_sg

    try:
        sg = ec2.create_security_group(
            GroupName=group_name, Description=description, VpcId=vpc_id
        )
        # Add tags to identify the Security Group for future reference
        sg.create_tags(Tags=[{"Key": "Name", "Value": group_name}])

        sg.authorize_ingress(
            IpPermissions=[
                {
                    "IpProtocol": "tcp",
                    "FromPort": 443,
                    "ToPort": 443,
                    "IpRanges": [{"CidrIp": "0.0.0.0/0"}],
                }
            ]
        )
        print(f"SUCCESS: Security Group erstellt: {sg.id}")
        return sg
    except ClientError as e:
        print(f"ERROR: Erstellung fehlgeschlagen: {e}")
        return None


def delete_security_group(vpc_id, group_name, region):
    ec2 = boto3.resource("ec2", region_name=region)
    sg = get_existing_sg(ec2, vpc_id, group_name)

    if not sg:
        print(f"INFO: Keine SG mit Name '{group_name}' zum Löschen gefunden.")
        return True

    try:
        print(f"DELETE: Lösche Security Group {sg.id}...")
        sg.delete()
        print("SUCCESS: Security Group gelöscht.")
        return True
    except ClientError as e:
        print(f"ERROR: Löschen nicht möglich: {e}")
        return False


if __name__ == "__main__":
    parser = argparse.ArgumentParser()
    parser.add_argument("--delete", action="store_true")
    args = parser.parse_args()

    # 1. Retrieve Security Group parameter  from the graph using Tera (using .strip() to avoid leading/trailing whitespace)
    VPC_NAME = "{{- origin_resource.network[0].name -}}".strip()
    GROUP_NAME = "{{- origin_resource.name -}}".strip()
    DESCRIPTION = "{{- origin_resource.description -}}"

    # 2. Set target region, default represents the fallback option
    TARGET_REGION = (
        "{{- origin_resource.region | default(value='eu-central-2') -}}".strip()
    )

    # Short hint for offline debugging
    print(f"--- Start Script ---")
    print(f"Suche VPC: '{VPC_NAME}' in Region: '{TARGET_REGION}'")

    try:
        # Discontinue in case VPC_NAME is empty
        if not VPC_NAME:
            raise Exception(
                "VPC_NAME not found!"
            )

        # 3. Dynamically retrieve VPC ID and Region
        # actual_region is matched on TARGET_REGION, to direct the Client to the correct region
        vpc_id, actual_region = get_vpc_details(VPC_NAME, TARGET_REGION)

        if args.delete:
            # 4. delete function
            delete_security_group(vpc_id, GROUP_NAME, actual_region)
        else:
            # 5. Check exist & Create
            my_sg = create_security_group(
                vpc_id, GROUP_NAME, DESCRIPTION, actual_region
            )
            if my_sg:
                # reload() ist wichtig, um den aktuellen Status von AWS zu ziehen
                my_sg.load()
                print(f"SG ID: {my_sg.id} | VPC: {vpc_id} | Region: {actual_region}")

    except Exception as e:
        # Return message in case of an error
        print(f"FATAL: {e}")
'''
