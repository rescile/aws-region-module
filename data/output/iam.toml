# Ressource
origin_resource = "login"

# Oracle Cloud Infrastructure Output
[[output]]
resource_type = "aws_login_template"
name = "{{- origin_resource.name -}}_template"
filename = "{{- provider | lower -}}_{{- origin_resource.name | lower -}}.py"
mimetype = "text/x-python"

template = '''
{
import boto3
from botocore.exceptions import ClientError
import json

def create_endpoint_policy():
    # This policy allows full access to the endpoint
    policy = {
        "Statement": [{
            "Action": "*",
            "Effect": "Allow",
            "Resource": "*",
            "Principal": "*"
        }]
    }
    return json.dumps(policy)

# To create an IAM Role (for the resource using the ENI/NLB)
def create_iam_role(role_name):
    iam = boto3.client('iam')
    trust_relationship = {
        "Version": "2012-10-17",
        "Statement": [{
            "Effect": "Allow",
            "Principal": {"Service": "ec2.amazonaws.com"},
            "Action": "sts:AssumeRole"
        }]
    }
    role = iam.create_role(
        RoleName=role_name,
        AssumeRolePolicyDocument=json.dumps(trust_relationship)
    )
    return role
'''
