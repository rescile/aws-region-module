name = "create"
description = "Create AWS Transit Hub"

exec = [["./ix", "create"]]

[runtime]
engine = "nix"
flake = "flake.nix"
files = ["ix", "./transit.py", "./salesforce.py", "./core", "./modules", "./controller"]

[env]
AWS_ACCESS_KEY_ID = "${secrets.aws.access_key}"
AWS_SECRET_ACCESS_KEY = "${secrets.aws.secret_key}"
VAULT_COLLECTION = "aws_network_hub_state"
