[[route]]
path = "/api/provider/state"
target = "https://ec2.amazonaws.com/"
forward_headers = ["Accept", "Content-Type", "Authorization", "X-Amz-Date", "X-Amz-Target"]

[route.inject_headers]
"Content-Type" = "application/json"

[[route]]
path = "/api/runner/*"
target = "http://127.0.0.1:3000/"
forward_headers = ["Accept", "Content-Type"]
