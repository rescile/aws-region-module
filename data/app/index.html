<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AWS Transit Hub Explorer | Rescile</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body
        class="bg-gray-100 font-sans antialiased text-gray-900 h-screen flex overflow-hidden"
    >
        <!-- Sidebar -->
        <aside
            class="w-64 bg-slate-900 shadow-xl flex-shrink-0 flex flex-col h-full z-10 text-white"
        >
            <div
                class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950"
            >
                <svg
                    class="w-6 h-6 text-amber-500 mr-2"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                    ></path>
                </svg>
                <h1 class="text-lg font-bold tracking-tight">
                    AWS Transit Hub
                </h1>
            </div>
            <nav class="flex-1 overflow-y-auto py-4" id="nav-menu">
                <!-- Navigation links injected by JS -->
            </nav>
            <div
                class="p-4 border-t border-slate-800 text-xs text-slate-400 bg-slate-950 flex flex-col gap-3"
            >
                <div>
                    Total Graph Nodes:
                    <span id="total-nodes" class="font-bold text-amber-500"
                        >...</span
                    >
                </div>
                <a
                    href="https://www.rescile.com"
                    target="_blank"
                    style="border-bottom: none"
                    class="flex items-center gap-2 hover:text-white transition-colors"
                >
                    <svg
                        style="height: 1.4em; width: auto"
                        viewBox="0 0 211 163"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle cx="103" cy="81" r="81" fill="#f59e0b" />
                        <path
                            d="M72.7 8.1c8.4-.5 16.8.8 24.9 3 5.3 1.8 10 4.2 13.2 8.2 2.8 4.1 2.2 5.1 1.5 10.5l13.2 60.7c3.9 18.8 12.6 21.4 20.5 25.7 7 4.5 13.2 7.4 24.3 10.3-7.6 2.3-15.3 4.5-24.3 5.4-5.5.1-11.1.8-15.7-1.4-10.5-5.5-13.3-12.9-16.4-20.2-4.6-11.9-5.7-23.6-7.8-35.2C101.2 89.5 92.6 98.8 84.8 108.9c-6.1 7.5-12.2 13-18.4 16.9-4.2 2.7-5.5 3.5-9.4 5.2-4.1 1.4-7.8 3.1-14.2 3.8 4.4-3.4 8.8-6.4 13.1-10.8 2.6-2.3 7-7.6 15.4-19.4 6.1-8.6 10.5-16.8 14.6-24.6 5.2-10.6 7.2-16.8 9-24.9.1-3.4-.7-5-1.6-7.4 3.5 1.7 5.6 3.8 8 5.9-1.5-6.3-3-12.6-4.8-19.2-1-3.7-4-8.1-7-12.5-2.1-2.7-4.3-5.2-7-6.9-3.3-2.1-6.7-3.8-9.7-5.5"
                            fill="#fff"
                        />
                    </svg>
                    rescile
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main
            class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-50"
        >
            <header
                class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-0"
            >
                <h2
                    id="view-title"
                    class="text-xl font-semibold text-slate-800"
                >
                    Overview
                </h2>
                <div class="flex items-center gap-4">
                    <button
                        onclick="executeEngine('create')"
                        class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 shadow-sm transition flex items-center gap-2"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Create
                    </button>
                    <button
                        onclick="executeEngine('update_state')"
                        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm transition flex items-center gap-2"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Update State
                    </button>
                    <button
                        onclick="executeEngine('destroy')"
                        class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 shadow-sm transition flex items-center gap-2"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Destroy
                    </button>
                    <button
                        onclick="refreshCurrentView()"
                        class="text-sm text-amber-600 hover:text-amber-800 flex items-center transition font-medium"
                    >
                        <svg
                            class="w-4 h-4 mr-1"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                            ></path>
                        </svg>
                        Sync Data
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-hidden p-8 relative flex flex-col">
                <!-- Loading Indicator -->
                <div
                    id="loader"
                    class="hidden absolute inset-0 bg-slate-50 bg-opacity-75 flex items-center justify-center z-10"
                >
                    <div
                        class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"
                    ></div>
                </div>

                <div
                    id="readOnlyNotice"
                    class="hidden mb-4 p-4 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg flex items-center text-sm flex-shrink-0"
                >
                    <svg
                        class="w-5 h-5 mr-2"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                        ></path>
                    </svg>
                    This application is currently in read only mode because of
                    missing enterprise features.
                </div>

                <!-- Content Container -->
                <div
                    id="content-container"
                    class="bg-white shadow-md rounded-xl border border-slate-200 overflow-hidden flex-1 flex flex-col min-h-0"
                >
                    <div class="p-8 text-center text-slate-500 mt-20">
                        Select a component category from the sidebar to explore
                        the transit zone.
                    </div>
                </div>
            </div>
        </main>

        <!-- Build Progress Modal -->
        <div
            id="buildModal"
            class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center z-50"
        >
            <div
                class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col"
            >
                <div class="px-6 py-4 border-b border-slate-200">
                    <h3
                        class="text-lg font-bold text-slate-800 flex items-center gap-2"
                    >
                        <svg
                            class="w-5 h-5 text-amber-500 animate-spin"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                            ></path>
                        </svg>
                        <span id="modalTitleText">Building Graph...</span>
                    </h3>
                </div>
                <div class="p-6 overflow-y-auto flex-1 bg-slate-900">
                    <pre
                        id="buildLogs"
                        class="text-xs text-slate-300 font-mono whitespace-pre-wrap word-break-all"
                    ></pre>
                </div>
                <div
                    class="px-6 py-4 border-t border-slate-200 flex justify-end bg-slate-50 rounded-b-xl"
                >
                    <button
                        id="buildCloseBtn"
                        onclick="closeBuildModal()"
                        disabled
                        class="px-4 py-2 text-sm font-medium text-slate-400 bg-slate-100 border border-slate-200 rounded cursor-not-allowed transition"
                    >
                        Building...
                    </button>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="app.js"></script>
        <script src="graphql.js"></script>
    </body>
</html>
