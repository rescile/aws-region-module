[module]
name = "AWS Transit Hub"
url = "https://github.com/rescile/aws_network_hub"
version = "0.0.1"
description = "The AWS Transit Hub deploys a transit network for SaaS provider in an AWS region to enable private connectivity to an onprem location. The transit network routes traffic between application VPCs and customer networks to allow operators creating a wide area cross-connect and manage security inspections and inter-service communication without the complexity of individual peering connections."
rescile_version = ">=0.1.159"

# dependencies: Optional list of other modules this module depends on.
[dependencies]
graphviewer = "https://github.com/rescile/graphviewer"
graml-module =  "https://github.com/rescile/graphml-module"
rescile-graphiql-module = "https://github.com/rescile/rescile-graphiql-module/releases/download/v0.0.3/graphiql-module-offline.zip"

[params.provider]
description = "The entity operating the platform."
required = true
default = "AWS"

[params.location]
description = "The geographical region where solutions are deployed."
required = true
default = "Europe (Zurich)"

[params.stage]
description = "The lifecycle stage of the solution."
required = true
default = "DEV"
allowed_values = ["DEV", "TEST", "PROD"]

[params.tenant]
description = "The tenant name identifiers the organization that uses the service."
required = true
default = "Org"

[assets."identity.csv"]
resource_type = "identity"
description = "The asset file defining virtual identities with access to AWS services."
name_template = "{{- scope | lower -}}_{{- name  | lower -}}_{{- function | lower -}}"
[assets."identity.csv".columns]
name = { type = "string", required = true }
function = { type = "string", required = true }
scope = { type = "string", required = false }

[generator.aws_region_endpoints]
description = "Get AWS regional endpoints from AWS IP Ranges API."
runner = "http"
target_input = "aws_region_endpoint.json"
method = "GET"
url = "https://ip-ranges.amazonaws.com/ip-ranges.json"
abort_on_failure = true

[generator.aws_price_index]
description = "Get AWS service index from AWS Pricing API."
runner = "http"
target_input = "aws_price_index.json"
method = "GET"
url = "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/index.json"
abort_on_failure = false

[generator.aws_region_service]
description = "Fetch AWS regional endpoints from GitHub."
runner = "exec"
target_input = "aws_region_service.json"
command = ["aws_region_service.sh"]
from_stdout = false

[generator.iana_port_registry]
description = "Fetch IANA system port list."
runner = "exec"
target_input = "iana_port_registry.json"
command = ["fetch_RFC_6335.sh"]
from_stdout = false
