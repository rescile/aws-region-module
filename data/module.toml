[module]
name = "AWS Transit Hub"
url = "https://github.com/rescile/aws_transit_hub"
version = "0.0.1"
description = "The AWS Transit Hub deploys a transit network for SaaS provider in an AWS region to enable private connectivity to an onprem location. The transit network routes traffic between application VPCs and customer networks to allow operators creating a wide area cross-connect and manage security inspections and inter-service communication without the complexity of individual peering connections."
rescile_version = ">=0.1.165"

# List of other modules this module depends on.
[dependencies]
graphviewer          = "https://github.com/rescile/graphviewer"
service-catalog      = "https://github.com/rescile/module-service-catalog"
compliance           = "https://github.com/rescile/rescile-ccm-lite-module"
hyperforce-connector = "https://github.com/rescile/module-hyperforce-connector"
asset-editor         = "https://github.com/rescile/asset-editor-module/releases/download/v{version}/asset-editor.zip"
graml-module         = "https://github.com/rescile/graphml-module"
#rescile-graphiql-module = "https://github.com/rescile/rescile-graphiql-module/releases/download/v{version}/graphiql-module-offline.zip"

[params.location]
description = "The geographical region where solutions are deployed."
required = true
default = "Europe (Zurich)"

[params.tenant]
description = "The tenant name identifiers the organization that uses the service."
required = true
default = "kpt"

[assets."identity.csv"]
resource_type = "identity"
description = "The asset file defining virtual identities with access to AWS services."
name_template = "{% if function == 'cloud' %}{{- function  | lower -}}_{{- name  | lower -}}_{{- role | lower -}}{% else %}{{- name  | lower -}}_{{- function  | lower -}}_{{- role | lower -}}{% endif %}"
[assets."identity.csv".columns]
name = { type = "string", required = true }
function = { type = "string", required = true }
role = { type = "string", required = true }

[assets."policy.csv"]
resource_type = "policy"
description = "tbd."
name_template = "{{- name  | lower -}}_{{- function  | lower -}}_policy"
[assets."policy.csv".columns]
name = { type = "string", required = true }
function = { type = "string", required = true }

[assets."dns.csv"]
resource_type = "record"
description = "tbd."
name_template = "{{- name  | lower -}}_zone_record"
[assets."dns.csv".columns]
name = { type = "string", required = true }
function = { type = "string", required = true }

[assets."solution.csv"]
resource_type = "solution"
description = "tbd"
name_template = "{{- name | lower -}}_{{- function | lower -}}"
[assets."solution.csv".columns]
name = { type = "string", required = true }
function = { type = "string", required = true }

[generator.aws_region_endpoints]
description = "Get AWS regional endpoints from AWS IP Ranges API."
ttl = "72h"
target_input = "aws_region_endpoint.json"
method = "GET"
url = "https://ip-ranges.amazonaws.com/ip-ranges.json"
abort_on_failure = true

[generator.aws_price_index]
description = "Get AWS service index from AWS Pricing API."
ttl = "72h"
target_input = "aws_price_index.json"
method = "GET"
url = "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/index.json"
abort_on_failure = false

[generator.aws_region_service]
description = "Fetch AWS regional endpoints from GitHub."
ttl = "72h"
target_input = "aws_region_service.json"
method = "GET"
url = "https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/endpoints.json"
abort_on_failure = true

[generator.aws_region_service.response_filter]
"tera!" = '''
{
{% set_global first = true %}
{% for region_code, region in response.partitions[0].regions %}
  {% if not first %},{% endif %}
  {{ region.description | json_encode | safe }}: {
    "region_code": {{ region_code | json_encode | safe }},
    "services": [
      {% set_global first_svc = true %}
      {% for service_name, service in response.partitions[0].services %}
        {% set_global has_endpoint = false %}
        {% if service.endpoints is defined %}
          {% for ep_name, ep_val in service.endpoints %}
            {% if ep_name == region_code %}
              {% set_global has_endpoint = true %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% if has_endpoint %}
          {% if not first_svc %},{% endif %}
          {{ service_name | json_encode | safe }}
          {% set_global first_svc = false %}
        {% endif %}
      {% endfor %}
    ]
  }
  {% set_global first = false %}
{% endfor %}
}
'''

[generator.iana_port_registry]
description = "Fetch IANA system port list."
ttl = "72h"
target_input = "iana_port_registry.json"
method = "GET"
url = "https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.csv"
abort_on_failure = true

[generator.iana_port_registry.response_filter]
"tera!" = '''
{
{% set_global first = true %}
{% for row in response %}
  {% set port_str = row["Port Number"] | default(value="") | trim %}
  {% if port_str is matching("^[0-9]+$") %}
    {% set port = port_str | int %}
    {% if (port > 0 and port <= 1023) or port == 1433 or port == 3000 or port == 3306 or port == 5432 or port == 6379 or port == 8080 or port == 27017 %}
      {% if not first %},{% endif %}
      "{{ port }}/{{ row['Transport Protocol'] }}": {
        "service": {{ row["Service Name"] | default(value="") | json_encode | safe }},
        "port": {{ port }},
        "protocol": {{ row["Transport Protocol"] | default(value="") | json_encode | safe }},
        "description": {{ row["Description"] | default(value="") | json_encode | safe }}
      }
      {% set_global first = false %}
    {% endif %}
  {% endif %}
{% endfor %}
}
'''
