[[create_resource]]
match_on = [{property = "name", value = "compute"}]
resource_type = "article"
relation_type = "DEFINED_BY"
name = "vm"
[create_resource.properties]
function = "infrastructure"
display = "Virtual Machine",
uid = "ART-CMP-001"
sla = "99.9%"
sla_type = "uptime"
active = true
support_tier = 2
cost_model = "Monthly fixed per vCPU/RAM"
features = [
    "Linux/Windows base OS",
    "Automated backups",
    "Firewall protection"
]
description = "tbd"
