# This model configures a port filter for in- and outbound traffic.
origin_resource = "network"

[[create_resource]]
create_from = { property = "firewall" }
relation_type = "PROTECTED_BY"
name = "{{- origin_resource.function -}}_{{- property.value -}}_sg"
[create_resource.properties]
function = "{{ property.value }}"
filter = ["general_outbound_filter","https_inbound_filter"]
description = "Default perimeter protection configuration for networks, zones and segments."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
