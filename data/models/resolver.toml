# A account represents a secure digital identity.
origin_resource = "provider"

[[create_resource]]
resource_type = "resolver"
relation_type = "DEFINED_BY"
match_on = [{ property = "function", not = "network" }]
name = "{{- origin_resource.name | lower -}}_resolver"
[create_resource.properties]
function = "{{ origin_resource._type }}"
public = false
zone = ["my.salesforce.com"]
description = "The {{ origin_resource.name | capitalize }} DNS service is a managed, authoritative name server cluster that operates exclusively within the control plane of a Virtual Private Cloud (VPC) or Virtual Network (VNET)."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

# Join the global dns resolver to the network.
origin_resource = "resolver"

[[link_resources]]
with = "network"
create_relation = { type = "SATISFIES" }

[[link_resources]]
with = "location"
create_relation = { type = "SATISFIES" }
