# This model represents a third tier model of a cloud network.
origin_resource = "network"

[[create_resource]]
match_on = [{ property = "function", value = "salesforce" }]
resource_type = "load_balancer"
relation_type = "DERIVED_FROM"
name = "{{- origin_resource.name | lower -}}_lb"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
description = "The {{ origin_resource.function | capitalize }} load balancer is a network service that takes incoming traffic and distributes it across multiple backend servers. This Virtual Service Engine (VSE) is a virtual instance where the traffic actually flows. It does SSL termination, packet inspection, and server routing. Unlike traditional hardware appliances, VSEs work together to support a Load Balancer service."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

# Join the vse to the subnet using the network identifier.
origin_resource = "load_balancer"

[[link_resources]]
with = "subnet"
match_with = [
    { expression = "{% if origin_resource.function == target_resource.function %}true{% endif %}" }
]
create_relation = { type = "CONNECTS_TO" }
