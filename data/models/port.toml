# This model represents a third tier model of a cloud network.
# Specify the resource dependency for a network
origin_resource = "port_filter"

ports = { "json!" = "iana_port_registry.json" }
pointer = { "function!" = "{{- property.value -}}/tcp" }

# Create the resource type
[[create_resource]]
create_from = { property = "port" }
relation_type = "COMPOSED_OF"
[create_resource.properties]
function = "{{ origin_resource._type }}"
protocol = "tcp"
service = "{{- ports[pointer].service -}}"
description = "{{- ports[pointer].description -}}"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
