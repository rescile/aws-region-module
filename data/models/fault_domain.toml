# This model represents a third tier model of a cloud domain and defines locations where provider resources can be consumed.
origin_resource = "region"

# Create the resource type
[[create_resource]]
create_from = { property = "availability_zone", as = "fault_domain" }
relation_type = "CONNECTED_TO"
name = "{{ provider | lower }}_{{- origin_resource.function | lower -}}_{{- property.value | lower -}}"
[create_resource.properties]
function = "continuity"
scope = "{{- origin_resource.function -}}"
original_name = "{{- property.value -}}"
pid = "{{- origin_resource.pid -}}{{- property.value -}}"
site = "{{- origin_resource.function -}}"
description = "AWS's availability zones spread your resources across AZs to achieve high availability. These are geographically separated but close enough for low-latency connections between them, each has independent power, cooling, and networking."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
