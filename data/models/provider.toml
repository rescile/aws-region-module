# A cloud provider owns and operates infrastructure, platforms and /or application as services, accessible over the internet.

[[create_resource]]
resource_type = "provider"
name = "{{- operator | lower -}}"
[create_resource.properties]
function = "platform"
description = "Amazon Web Services (AWS) operates data centers to rent out computing power, storage, and/or software. The operator distinguishes itself through the broad service portfolio of platform services, ranging from serverless functions to hardware accelerators."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "provider"
name = "ixConnect"
[create_resource.properties]
function = "application"
description = "Inventx Connect is a network service provider offering on-demand layer two connectivity between data centers, cloud providers, and managed networks worldwide. Through a centralized portal or API, users can provision point-to-point connections and adjust bandwidth in real time, bypassing traditional telecom infrastructure."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

# Join the login to the provider using the identity credentials.
origin_resource = "provider"

[[link_resources]]
with = "network"
join = { local = "name", remote = "provider" }
create_relation = { type = "PROVIDED_BY" }
