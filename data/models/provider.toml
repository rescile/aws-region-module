# A cloud provider owns and operates data centers to "rent out" computing power, storage, and/or software.

[[create_resource]]
resource_type = "provider"
name = "{{- provider | lower -}}"
[create_resource.properties]
function = "cloud"
description = "Amazon Web Services (AWS) operates numberous scalable and integrated cloud services. The platform distinguishes itself through the broad service portfolio, ranging from serverless functions to hardware accelerators."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

# Join the login to the provider using the identity credentials.
origin_resource = "provider"

[[link_resources]]
with = "login"
create_relation = { type = "MANAGED_BY" }

[[link_resources]]
with = "network"
create_relation = { type = "PROVIDED_BY" }
