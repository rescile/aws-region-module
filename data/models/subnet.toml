# This model represents a third tier model of a cloud network.
# Specify the resource dependency for a network
origin_resource = "network"

# Create the resource type
[[create_resource]]
create_from = { property = "subnet" }
relation_type = "CONNECTED_TO"
name = "{{- origin_resource.function -}}_subnet_{{- property.value | lower-}}"
[create_resource.properties]
function = "{{- property.value -}}"
enable_dns_support = true
enable_dns_hostnames = true
description = "The {{ property.value }} subnet is a logical partition of the {{ origin_resource.function }} network — it carves up the cloud network into smaller blocks, each with its own IP range and running in a different availability zone."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
