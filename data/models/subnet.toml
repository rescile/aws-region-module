# This model represents a third tier model of a cloud network.
# Specify the resource dependency for a network
origin_resource = "network"

# Evaluated LOCALLY per iteration — origin_resource is the current network
subnet_list = { "function!" = '''
  {% set count = origin_resource.fault_domain | length %}
  {% set range = origin_resource.cidr | default(value="10.0.0.0/8") | cidr_split_n(n=count) %}
  {{- range | json_encode | safe -}}
''' }

# Create the resource type
[[create_resource]]
create_from = { property = "fault_domain", as = "subnet" }
relation_type = "CONNECTED_TO"
name = "{{- origin_resource.function -}}_subnet_{{- property.value | lower-}}"
[create_resource.properties]
function = "failover"
original_name = "{{ property.value }}"
cidr = "{{ subnet_list | nth(n=property.index) }}"
public = false
#fault_domain = "{{- provider | lower -}}_{{- origin_resource.site | lower -}}_{{- property.value | lower -}}"
description = "Subnet {{ property.value }} is a logical partition of the {{ origin_resource.function }} network — it carves up the cloud network into smaller blocks, each with its own IP range and running in a different availability zone."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

# Join the login to the platform using the identity credentials.
origin_resource = "subnet"

[[link_resources]]
with = "fault_domain"
match_with = { property = "original_name", value = "{{ origin_resource.original_name }}" }
create_relation = { type = "DEPENDS_ON" }
