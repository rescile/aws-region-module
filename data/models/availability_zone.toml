# This model represents a third tier model of a cloud domain and defines locations where provider resources can be consumed.
origin_resource = "region"

# Create the resource type
[[create_resource]]
create_from = { property = "availability_zone" }
relation_type = "HOSTED_ON"
name = "{{- provider | lower -}}_{{- origin_resource.function | lower -}}_ad"
[create_resource.properties]
function = "availability"
uid = "{{- origin_resource.uid -}}{{- property.value -}}"
site = "{{- origin_resource.site -}}"
description = "."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
