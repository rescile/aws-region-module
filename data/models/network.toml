# This model represents a second tier model of a cloud platform that is defined based on a router.

origin_resource = "router"

regions = { "json!" = "aws_region_service.json" }
site = "{{- location | regexp(expr='s/.*\\((.*)\\)/\\1/') | lower | replace(from=' ', to='') -}}"

block = { "template!" = '''
    {%- if property.value == "management" -%}
        {%- set_global range = "10.101.0.0/16" -%}
    {%- elif property.value == "transit" -%}
        {%- set_global range = "10.100.0.0/16" -%}
    {%- else -%}
        {%- set_global range = "10.10.0.0/16" -%}
    {%- endif -%}
    {{- range -}}
'''}

functions = { "template!" = '''
    {%- if property.value == "management" -%}
        {%- set_global funct = "transit" -%}
    {%- else -%}
        {%- set_global funct = property.value -%}
    {%- endif -%}
    {{- funct -}}
'''}

subnets = { "template!" = '''
    {%- set segment = [] -%}
    {%- if property.value == "management" -%}
        {%- set_global segment = segment | concat(with="a") -%}
        {%- set_global segment = segment | concat(with="b") -%}
    {%- endif -%}
    {{- segment | json_encode -}}
'''}

gateways = { "template!" = '''
    {%- if property.value == "transit" -%}
        {%- set_global list = [
          "vpn"
        ] -%}
    {%- else -%}
        {%- set_global list = [] -%}
    {%- endif -%}
    {{- list | json_encode | safe -}}
'''}

telemetry = { "template!" = '''
    {%- if property.value == "management" -%}
        {%- set_global logging = false -%}
    {%- else -%}
        {%- set_global logging = true -%}
    {%- endif -%}
    {{- logging -}}
'''}

# Create the resource type
[[create_resource]]
create_from = { property = "network" }
relation_type = "CONNECTED_TO"
name = "{{- origin_resource.region[0].name -}}_{{- property.value -}}"
[create_resource.properties]
function = "{{- functions -}}"
region_code = "{{ regions[location].region_code }}"
cidr = "{{- block -}}"
subnet = "{{- subnets -}}"
gateway = "{{- gateways -}}"
logging = "{{- telemetry -}}"
firewall = ["default"]
enable_dns_support = true
enable_dns_hostnames = true
description = "The {{ property.value }} network is a virtualized network infrastructure that connects compute resources and services at {{ origin_resource.provider | capitalize }}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
