# This model represents a second tier model of a cloud platform that is defined based on a router.
# Specify the resource dependency for a network
origin_resource = "router"

block = { "template!" = '''
    {%- if property.value == "management" -%}
        {%- set_global range = "172.16.0.0/16" -%}
    {%- else -%}
        {%- set_global range = "10.0.0.0/24" -%}
    {%- endif -%}
    {{- range -}}
'''}

subnets = { "template!" = '''
    {%- set segment = [] -%}
    {%- if property.value == "management" -%}
        {%- set_global segment = segment | concat(with=b_connect) -%}
    {%- endif -%}
    {{- segment | json_encode -}}
'''}

gateways = { "template!" = '''
    {%- if property.value == "transit" -%}
        {%- set_global interface = ["Salesforce"] -%}
    {%- else -%}
        {#- Fixed the typo from .vaule to .value -#}
        {%- set_global interface = [property.value] -%}
    {%- endif -%}
    {{- interface | json_encode | safe -}}
'''}

# Create the resource type
[[create_resource]]
create_from = { property = "network" }
relation_type = "CONNECTED_TO"
name = "{{- origin_resource.site -}}_{{- property.value -}}"
[create_resource.properties]
function = "{{- property.value -}}"
cidr = "{{- block -}}"
site = "{{- origin_resource.site -}}"
subnet = "{{- subnets -}}"
gateway = "{{- gateways -}}"
flow_logs = true
enable_dns_support = true
enable_dns_hostnames = true
description = "The {{ property.value }} network is a virtualized network infrastructure that connects compute resources and services at {{ provider }}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
