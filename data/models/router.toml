# This model represents a third tier model of a cloud domain and defines routers where provider resources become accessible.
origin_resource = "region"

# Create the resource type
[[create_resource]]
resource_type = "router"
match_on = [{ property = "region_code", exists = true }]
name = "{{- origin_resource.name | lower -}}_router"
relation_type = "COMPOSED_OF"
[create_resource.properties]
function = "{{ origin_resource._type }}"
region = "{{- origin_resource.name -}}"
region_code = "{{- origin_resource.region_code -}}"
provider = "{{- origin_resource.provider[0].name -}}"
network = [ "transit", "management", "salesforce", "application" ]
description = "The cloud router in {{ origin_resource.function | capitalize }} is a regional network function, operated by {{ origin_resource.provider }}, that analyzes incoming data packets, determines the best path for them to travel across interconnected networks, and forwards them toward their intended destination."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
