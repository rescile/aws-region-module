# This model represents a third tier model of a cloud domain and defines gateways for a network
origin_resource = "resolver"

regions = { "json!" = "aws_region_service.json" }

# Create the resource type
[[create_resource]]
create_from = { property = "zone" }
relation_type = "DEFINED_BY"
name = "{{- property.value | lower -}}"
[create_resource.properties]
function = "{{ origin_resource._type }}"
region_id = "{{ regions[location].region_code }}"
record = ["development"]
description = "A DNS zone is an administrative namespace that a single entity manages, containing resource records that map domain names to IP addresses."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
