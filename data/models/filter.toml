# This model configures a port filter for in- and outbound traffic.

[[create_resource]]
resource_type = "filter"
name = "general_outbound_filter"
[create_resource.properties]
function = "ingress"
protocol = "-1"
from_port = 0
to_port = 0
cidr = []
description = "Allows unrestricted outbound traffic to assigned network zones."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "filter"
name = "https_inbound_filter"
[create_resource.properties]
function = "egress"
protocol = "tcp"
from_port = 443
to_port = 443
cidr = []
description = "Restricts inbound traffic from assigned network segments to https."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
