# This model represents a second tier model of a cloud platform that extends a network with service endpoints.
origin_resource = "provider"

site = "{{- city | regexp(expr='s/.*\\((.*)\\)/\\1/') | lower | replace(from=' ', to='') -}}"

[[create_resource]]
match_on = [
  { property = "name", not = "{{- operator | lower -}}" }
]
resource_type = "interface"
relation_type = "EXCHANGES_DATA"
name = "{{- origin_resource.name -}}_{{- site -}}_interface"
[create_resource.properties]
function = "endpoint"
address = "com.amazonaws.vpce.eu-central-2.vpce-svc-xxxxxxxxxxxxxxxxx" # Obtained from Salesforce Org
port_filter = ["salesforce_inbound_filter"]
private_dns_enabled = false
