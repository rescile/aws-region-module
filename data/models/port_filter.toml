# This model represents a third tier model of a cloud network.

[[create_resource]]
resource_type = "port_filter"
name = "https_ingress_filter"
[create_resource.properties]
function = "security"
port = [443]
description = "Inbound HTTPS from internal application CIDR"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "port_filter"
name = "salesforce_inbound_filter"
[create_resource.properties]
function = "security"
port = [443]
description = "Inbound Saelsforce from application CIDR"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

# Specify the resource dependency for a network
origin_resource = "port_filter"

[[link_resources]]
with = "network"
match_with = [
    { expression = "{% if target_resource.function != 'management' %}true{% endif %}" }
]
create_relation = { type = "PROTECTS" }

[[link_resources]]
with = "subnet"
create_relation = { type = "PROTECTS" }
