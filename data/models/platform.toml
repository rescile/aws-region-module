# A cloud provider owns and operates data centers to "rent out" computing power, storage, and/or software.

regions = { "json!" = "aws_region_service.json" }
city = "{{- location | regexp(expr='s/.*\\((.*)\\)/\\1/') | lower | replace(from=' ', to='') -}}"

[[create_resource]]
resource_type = "platform"
name = "{{- provider | lower -}}_{{- city -}}"
[create_resource.properties]
function = "cloud"
region = "{{ regions[location].region_code }}"
site = "{{- city -}}"
portfolio = "{{ regions[location].services }}"
description = "Amazon Web Services (AWS) operates numberous scalable and integrated cloud services in {{ city | capitalize }}. The AWS platform distinguishes itself primarily through the breadth of its service portfolio, ranging from serverless functions to hardware accelerators."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
