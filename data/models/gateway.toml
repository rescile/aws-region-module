# This model represents a third tier model of a cloud domain and defines gateways for a network
origin_resource = "network"

cpe = { "template!" = '''
    {%- if property.value | lower == "salesforce" -%}
        {%- set_global providerID = "com.amazonaws.vpce.us-east-1.vpce-svc-salesforcexxxx" -%}
    {%- else -%}
        {%- set_global providerID = "com.amazonaws.vpce.us-east-1.vpce-svc-megaportxxxx" -%}
    {%- endif -%}
    {{- providerID -}}
'''}

# Create the resource type
[[create_resource]]
create_from = { property = "gateway" }
relation_type = "CONNECTS_TO"
name = "{{- origin_resource.provider[0].name | lower -}}_{{- property.value | lower -}}_gateway"
[create_resource.properties]
function = "{{- property.value | lower -}}"
pid = "{{- cpe -}}"
private_dns_enabled = true
description = "The {{ property.value | capitalize }} gateway is a network node that connects two different networks with dissimilar architectures and protocols so that data can flow between them."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

# Join the login to the provider using the identity credentials.
origin_resource = "gateway"

[[link_resources]]
with = "policy"
create_relation = { type = "GOVERNED_BY" }
