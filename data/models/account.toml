# A account represents a secure digital identity that provides access to cloud provider resources.
origin_resource = "provider"

[[create_resource]]
resource_type = "account"
relation_type = "DEFINED_BY"
name = "{{- origin_resource.name | lower -}}_account"
[create_resource.properties]
function = "{{ origin_resource._type }}"
provider = "{{- origin_resource.name -}}"
pid = "{{- origin_resource.name | lower -}}_id"
key = "{{- origin_resource.name | lower -}}_key"
description = "The {{ origin_resource.name  }} account is a secure digital identity that grants authorized access to {{ origin_resource.name | capitalize }}'s cloud resources and enables a centralized management hub to automate cloud service deployments and configurations."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "account"

[[link_resources]]
with = "instance"
create_relation = { type = "SATISFIES" }
